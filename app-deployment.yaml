apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-gitops-app
  namespace: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
      - name: web
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-gitops-sevice
  namespace: argocd
spec:
  type: ClusterIP
  Selector:
    app: my-web-app
  ports:
  - port: 80
    targetPort: 80
  
